# Reverse proxy for AgentShield: TLS, rate limits and a body size cap in front of ONE uvicorn worker.
# Put the cert paths and server_name in place before use. Not tested against a live nginx yet.
limit_req_zone $http_x_api_key zone=per_key:10m rate=200r/s;
# The per-IP limit applies only to requests with no API key, so a customer sending all its traffic from one address
# is limited by its own key (200/s), not by the shared address.
map $http_x_api_key $anon_ip { "" $binary_remote_addr; default ""; }
limit_req_zone $anon_ip zone=per_ip:10m rate=50r/s;

# Each API key always reaches the same API process, because feature state lives in that process's memory.
# To run more API processes, add one "server" line each. Rotating a key moves that customer to another process
# for a while, so its fraud features start cold there (replay protection is shared through Redis and is not affected).
upstream agentshield {
    hash $http_x_api_key consistent;
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate     /etc/ssl/agentshield/fullchain.pem;
    ssl_certificate_key /etc/ssl/agentshield/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64k;   # a scoring call is a few hundred bytes
    client_body_timeout  5s;

    location = /healthz {
        proxy_pass http://agentshield;
    }
    location / {
        limit_req zone=per_key burst=100 nodelay;
        limit_req zone=per_ip  burst=50  nodelay;
        limit_req_status 429;
        proxy_pass http://agentshield;
        proxy_set_header Host $host;
        proxy_read_timeout 2s;
    }
}
server { listen 80; return 301 https://$host$request_uri; }
